name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install curl_cffi==0.16.3 pyinstaller==6.20.0 -r launcher-requirements.txt
      - name: Check release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content sources.json -Raw | ConvertFrom-Json).tool.version
          if ($env:RELEASE_TAG -cne "v$version") { throw "Release tag does not match sources.json." }
      - name: Run fast tests before packaging
        shell: pwsh
        run: |
          $modules = @(Get-ChildItem -Filter 'test*.py' -File | Where-Object { $_.BaseName -ne 'test_release' } | Sort-Object Name | ForEach-Object { $_.BaseName })
          if ($modules.Count -eq 0) { throw 'No fast test modules were found.' }
          python -m unittest @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # test_release builds and verifies the archive; reuse that artifact for publishing.
      - name: Test and package release
        run: python -m unittest discover
      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist-release/HeyListen-Get.zip
            dist-release/SHA256SUMS.txt
